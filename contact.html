<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Contact MySite - Get in touch with us."/>
  <title>MySite | Contact</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="logo">MySite</div>
    <div class="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- CONTACT -->
  <section class="contact">
    <h1>Contact Us 📬</h1>
    <p class="subtitle">We'd love to hear from you. Fill in the form below!</p>

    <!-- ✅ FIX: onsubmit returns validateForm(), message field added, error + success elements -->
    <form onsubmit="return validateForm()">
      <input type="text"  id="name"    placeholder="Your Name"    autocomplete="name" />
      <input type="email" id="email"   placeholder="Your Email"   autocomplete="email" />
      <textarea           id="message" placeholder="Your Message"></textarea>
      <p id="error-msg"   class="error-msg"></p>
      <p id="success-msg" class="success-msg"></p>
      <button type="submit">Send Message</button>
    </form>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 MySite | Designed by Guna 🚀</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
